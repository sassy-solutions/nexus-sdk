name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # --locked-mode des le premier commit. Le monorepo d'origine portait la
      # propriete sans qu'aucun workflow ne la verifie, et neuf lock files avaient
      # derive sans que personne le voie. Pour un artefact expedie a des tenants,
      # la reproductibilite de la chaine d'approvisionnement pese plus qu'ailleurs.
      - name: Restore (locked, no credentials)
        run: dotnet restore SassySolutions.Nexus.sln --locked-mode

      - name: Build
        run: dotnet build SassySolutions.Nexus.sln -c Release --no-restore

      - name: Test
        run: dotnet test SassySolutions.Nexus.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack SassySolutions.Nexus.sln -c Release --no-build -o artifacts

      # Le paquet est public et definitif : une version sur nuget.org ne se
      # depublie jamais. Ce pas est la derniere barriere avant l'irreversible.
      # Ce garde est DELIBEREMENT generique. La version precedente listait les noms
      # de nos fournisseurs et de nos namespaces pour les chercher — publiant ainsi,
      # dans un depot public, l'inventaire exact de ce qu'on cherche a ne pas publier.
      # La verification nominative appartient au depot prive, avant la copie.
      - name: Aucun secret ni adresse interne dans les artefacts
        run: |
          mkdir -p /tmp/audit
          for f in artifacts/*.nupkg; do unzip -qo "$f" -d "/tmp/audit/$(basename "$f" .nupkg)"; done
          rc=0
          # Adresses non routables depuis l'exterieur : un defaut interne qui a fuite.
          if grep -rqiE '\.(svc|local)\b|\.internal\b|://(10|127|192\.168)\.' /tmp/audit --include='*.xml' --include='*.md' --include='*.nuspec' 2>/dev/null; then
            echo "::error::une adresse non publique part dans un artefact"; rc=1
          fi
          # Formes de credentials.
          if grep -rqE '(gh[pousr]_[A-Za-z0-9]{16}|github_pat_[A-Za-z0-9_]{20}|-----BEGIN [A-Z ]*PRIVATE KEY)' /tmp/audit 2>/dev/null; then
            echo "::error::une forme de credential part dans un artefact"; rc=1
          fi
          # Symboles et sources : jamais.
          if ls /tmp/audit/*/lib/*/*.pdb >/dev/null 2>&1; then
            echo "::error::des symboles partent dans le paquet"; rc=1
          fi
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: artifacts/*.nupkg
